<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lap Timer Demo — Lab</title>
  <style>
    body { margin: 0; background: #12141a; color: #e8e9ee; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    a { color: #7da2ff; }
    h1 { font-size: 1.4rem; margin: 8px 0 4px; }
    p.sub { color: #9a9cab; margin: 0 0 20px; }
    canvas { width: 100%; height: 160px; background: #1a1d26; border-radius: 8px; display: block; }
    .stats { display: flex; gap: 12px; margin: 14px 0; flex-wrap: wrap; }
    .stat { background: #1a1d26; border-radius: 8px; padding: 10px 14px; flex: 1; min-width: 120px; }
    .stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
    .stat span { color: #9a9cab; font-size: 0.8rem; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid #262a36; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #9a9cab; font-weight: 500; font-size: 0.8rem; }
    .best { color: #c58cff; font-weight: 600; }
    .faster { color: #5fd38d; } .slower { color: #ff7a7a; }
    button { background: #7da2ff; color: #12141a; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <a href="../">← Back to Lab</a>
  <h1>Lap Timer Demo</h1>
  <p class="sub">Simulated data — a stand-in for the live telemetry visualiser. Laps take about 12 seconds.</p>

  <canvas id="trace" width="720" height="160"></canvas>

  <div class="stats">
    <div class="stat"><b id="speed">0</b><span>km/h</span></div>
    <div class="stat"><b id="lapTime">0.00</b><span>current lap (sector <span id="sector">1</span>)</span></div>
    <div class="stat"><b id="delta">–</b><span>delta to best at last split</span></div>
    <div class="stat"><button id="toggle">Pause</button></div>
  </div>

  <table>
    <thead><tr><th>Lap</th><th>S1</th><th>S2</th><th>S3</th><th>Time</th></tr></thead>
    <tbody id="laps"></tbody>
  </table>
</main>

<script>
  const TICK = 0.05;                 // simulated seconds per step
  const SECTORS = 3;
  const canvas = document.getElementById("trace");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);

  let lapNo = 1, t = 0, lapLength = newLapLength();
  let splits = [];                   // cumulative times at each sector boundary this lap
  let laps = [];                     // { no, sectors: [..], total }
  let trace = [];
  let running = true;

  function newLapLength() { return 11.4 + Math.random() * 1.2; }

  // Speed as a function of lap progress (0..1), so every lap has the same "shape".
  function speedAt(p) {
    return 160 + 70 * Math.sin(p * Math.PI * 4) + 35 * Math.sin(p * Math.PI * 10) + (Math.random() - 0.5) * 6;
  }

  function fmt(sec) { return sec.toFixed(2); }

  function bestLap() { return laps.reduce((b, l) => (!b || l.total < b.total ? l : b), null); }
  function bestSector(i) { return Math.min(...laps.map((l) => l.sectors[i])); }

  function step() {
    t += TICK;
    const p = t / lapLength;
    const sector = Math.min(SECTORS, Math.floor(p * SECTORS) + 1);

    // Crossed a sector boundary?
    if (splits.length < sector - 1) {
      splits.push(t);
      const best = bestLap();
      if (best) {
        const ref = best.sectors.slice(0, splits.length).reduce((a, b) => a + b, 0);
        const d = t - ref;
        $("delta").textContent = (d >= 0 ? "+" : "") + fmt(d);
        $("delta").className = d <= 0 ? "faster" : "slower";
      }
    }

    // Lap complete
    if (t >= lapLength) {
      const cumulative = [...splits, lapLength];
      const sectors = cumulative.map((c, i) => c - (cumulative[i - 1] || 0));
      laps.push({ no: lapNo, sectors, total: lapLength });
      lapNo += 1; t = 0; splits = []; lapLength = newLapLength();
      renderTable();
    }

    const speed = speedAt(t / lapLength);
    trace.push(speed);
    if (trace.length > 300) trace.shift();

    $("speed").textContent = Math.round(speed);
    $("lapTime").textContent = fmt(t);
    $("sector").textContent = sector;
    draw();
  }

  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#7da2ff"; ctx.lineWidth = 2; ctx.beginPath();
    trace.forEach((v, i) => {
      const x = (i / 300) * w, y = h - (v / 300) * h;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  }

  function renderTable() {
    const best = bestLap();
    const bests = Array.from({ length: SECTORS }, (_, i) => bestSector(i));
    $("laps").innerHTML = laps.slice(-8).reverse().map((l) => {
      const cells = l.sectors.map((s, i) => `<td class="${s === bests[i] ? "best" : ""}">${fmt(s)}</td>`).join("");
      return `<tr><td>${l.no}</td>${cells}<td class="${l === best ? "best" : ""}">${fmt(l.total)}</td></tr>`;
    }).join("");
  }

  setInterval(() => { if (running) step(); }, TICK * 1000);
  $("toggle").addEventListener("click", () => {
    running = !running;
    $("toggle").textContent = running ? "Pause" : "Resume";
  });
</script>
</body>
</html>
